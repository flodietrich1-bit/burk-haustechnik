<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thesen & MVP · Firmengruppe Burk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy1:#0A2540;--navy2:#0E3C63;--blue:#0082C9;--blueL:#3FA9E8;--sky:#8FD0F5;
 --ink:#152534;--slate:#5C6B7A;--line:#E3EBF2;--bg:#EEF3F8;--amber:#E08A2B;--teal:#12897E;--tealbg:#E1F3F1;}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{font-family:Inter,system-ui,Arial,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 50% -10%,#12314f,#081a2c 70%);overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.deck{position:relative;width:min(95vw,1300px);height:min(95vh,731px);border-radius:20px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.55)}
#bar{position:absolute;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--blueL));z-index:40;transition:width .5s ease;border-radius:0 3px 3px 0}
.slide{position:absolute;inset:0;background:var(--bg);display:none}.slide.on{display:block}
.slide.on .rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*80ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.slide.on .fade{animation:fade .7s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{position:absolute;left:0;top:0;bottom:0;width:33%;background:linear-gradient(160deg,var(--navy1),var(--navy2));color:#fff;padding:52px 36px;display:flex;flex-direction:column}
.panel.sec{background:linear-gradient(160deg,#0B3358,#0E4E7A)}
.kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--sky);font-weight:600}
.phase{font-family:Sora;font-size:30px;font-weight:800;margin-top:16px;color:#fff;line-height:1.14;letter-spacing:-.3px}
.pdesc{font-size:13.5px;color:#9FC3E0;margin-top:12px;line-height:1.45}
.rail{margin-top:auto;display:flex;flex-direction:column}
.rnode{display:flex;align-items:center;gap:12px;height:33px;position:relative}
.rdot{width:11px;height:11px;border-radius:50%;background:#2b4d70;flex:0 0 auto;transition:.4s}
.rnode.act .rdot{background:var(--blueL);box-shadow:0 0 0 5px rgba(63,169,232,.22)}
.rnode:not(:last-child):after{content:"";position:absolute;left:5px;top:24px;width:1.5px;height:18px;background:#22405f}
.rlbl{font-size:12.5px;color:#6f88a2;transition:.3s}.rnode.act .rlbl{color:#fff;font-weight:600}
.content{position:absolute;left:33%;right:0;top:0;bottom:0;padding:52px 56px 46px;display:flex;flex-direction:column}
.ctitle{font-family:Sora;font-size:32px;font-weight:800;line-height:1.12;letter-spacing:-.4px}
.csub{font-size:14.5px;color:var(--slate);margin-top:9px;font-weight:500}
.theses{flex:1;display:flex;flex-direction:column;justify-content:center;gap:17px;padding:14px 0}
.th{display:flex;gap:15px;align-items:flex-start}
.thb{width:27px;height:27px;border-radius:8px;background:#fff;border:1px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:700;font-size:13px;font-family:Sora;box-shadow:0 3px 8px rgba(20,50,80,.06);margin-top:2px}
.tht{font-size:16.5px;line-height:1.5;color:#243646}.tht b{color:var(--ink);font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;margin-left:6px;vertical-align:middle;transform:translateY(-1px)}
.tag.it{background:#E7F2FB;color:#1E6FA8}.tag.test{background:var(--tealbg);color:var(--teal)}.tag.opt{background:#EFEAF7;color:#6B4CA8}
.stat{margin-top:6px;background:linear-gradient(135deg,var(--navy1),var(--navy2));color:#fff;border-radius:14px;padding:20px 24px;display:flex;gap:22px;align-items:center}
.stat .n{font-family:Sora;font-size:38px;font-weight:800;white-space:nowrap;color:#8FD0F5;line-height:1}
.stat .t{font-size:13.5px;line-height:1.45;color:#cfe3f4}
.foot{position:absolute;right:56px;bottom:20px;font-size:12px;color:#9aa9b7}
.mvprow{flex:1;display:flex;gap:34px;align-items:center}.mcol{flex:1}.mcol .th{margin:15px 0}
.phone{width:236px;height:474px;border-radius:34px;background:#0A2540;padding:11px;box-shadow:0 24px 50px rgba(6,24,42,.4);flex:0 0 auto}
.scr{background:#F4F8FC;border-radius:24px;height:100%;overflow:hidden;position:relative;display:flex;flex-direction:column}
.shead{background:var(--blue);color:#fff;padding:18px 16px 14px}.shead .rm{font-size:11px;opacity:.85}.shead .rn{font-family:Sora;font-weight:700;font-size:16px;margin-top:2px}
.ssearch{margin:12px 14px 6px;background:#fff;border:1px solid #DCE6F0;border-radius:10px;padding:9px 12px;color:#8496A6;font-size:12.5px}
.srow{margin:8px 14px;background:#fff;border:1px solid #E3EBF2;border-radius:12px;padding:11px 12px;box-shadow:0 3px 8px rgba(20,50,80,.05)}
.srow .nm{font-size:12.5px;font-weight:600;color:#243646}
.chip{display:inline-block;margin-top:6px;font-size:10px;background:var(--tealbg);color:var(--teal);padding:2px 7px;border-radius:10px}
.step{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.sbtn{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sval{font-family:Sora;font-weight:700;font-size:16px;color:var(--ink)}
.sdone{margin:auto 14px 16px;background:var(--navy1);color:#fff;border-radius:10px;text-align:center;padding:11px;font-weight:600;font-size:13px}
.tcols{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:22px;align-content:center}
.tcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:0 8px 20px rgba(20,50,80,.06)}
.tcard h3{font-family:Sora;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:12px}
.tcard.dark{background:linear-gradient(150deg,var(--navy1),var(--navy2));border:none}.tcard.dark h3{color:#fff}
.tli{display:flex;gap:11px;margin:11px 0;font-size:14px;line-height:1.4;color:#33475b}.tcard.dark .tli{color:#cfe3f4}
.tdot{width:20px;height:20px;border-radius:6px;background:var(--tealbg);color:var(--teal);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
.tcard.dark .tdot{background:rgba(143,208,245,.18);color:#8FD0F5}
.hero{position:absolute;inset:0;background:linear-gradient(160deg,#0A2540,#0E3C63)}
.hero .head{padding:48px 56px 0}
.hkick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--sky);font-weight:600}
.htitle{font-family:Sora;font-size:40px;font-weight:800;color:#fff;margin-top:12px;letter-spacing:-.5px}
.hmeta{color:#9FC3E0;font-size:15px;margin-top:8px}
.hstats{position:absolute;top:54px;right:56px;text-align:right}.hstats .big{font-family:Sora;font-size:46px;font-weight:800;color:#fff}.hstats .lab{color:#8FB6D6;font-size:13px;margin-top:2px}
.tl{position:absolute;left:56px;right:56px;top:198px;bottom:54px;display:grid;grid-template-columns:1fr 1fr;gap:18px 26px}
.tlcard{background:rgba(255,255,255,.05);border:1px solid rgba(143,208,245,.18);border-radius:14px;padding:20px 22px}
.tldate{display:flex;align-items:center;gap:10px}
.tlchip{background:var(--blue);color:#fff;font-weight:700;font-size:12.5px;padding:4px 11px;border-radius:16px;font-family:Sora}
.tlwhen{color:#8FB6D6;font-size:12.5px}
.tlh{color:#fff;font-family:Sora;font-weight:700;font-size:17px;margin-top:11px;line-height:1.25}
.tld{color:#B9D2E6;font-size:13.5px;line-height:1.45;margin-top:7px}.tlhrs{color:#6f93b3;font-size:12px;margin-top:9px}
.heroLogo{position:absolute;bottom:26px;right:56px;width:44px;height:44px;border-radius:9px;overflow:hidden;opacity:.85}.heroLogo img{width:100%;display:block}
#dots{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:50}
.dot{width:8px;height:8px;border-radius:50%;background:#3a5871;cursor:pointer;transition:.25s}.dot.on{background:var(--blueL);width:22px;border-radius:5px}
.hint{position:fixed;bottom:16px;right:18px;color:#5c778f;font-size:11.5px;z-index:50}
.device{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:10px}.dframe{width:256px;height:466px;border-radius:30px;background:#0A2540;padding:10px;box-shadow:0 24px 50px rgba(6,24,42,.4);overflow:hidden;position:relative}.dscreen{width:440px;height:820px;border:0;background:#fff;transform:scale(.536);transform-origin:top left;position:absolute;top:10px;left:10px}.dcap{font-size:12px;color:var(--slate)}
</style></head><body>

function tagize(t){return t.replace(/\[IT\]/g,'<span class="tag it">&#8594; IT</span>').replace(/\[TEST\]/g,'<span class="tag test">Testidee</span>').replace(/\[OPT\]/g,'<span class="tag opt">optional</span>');}
function panel(o,mrail){
 const arr=Array.isArray(mrail)?mrail:(mrail?MRAIL:RAIL);
 const r=arr.map((x,i)=>`<div class="rnode ${o.act===i?'act':''}"><span class="rdot"></span><span class="rlbl">${i+1}. ${x}</span></div>`).join("");
 return `<div class="panel ${mrail?'sec':''}"><div class="kick fade">${o.kick}</div><div class="phase rise" style="--i:1">${o.phase}</div>
   ${o.pdesc?`<div class="pdesc rise" style="--i:2">${o.pdesc}</div>`:''}<div class="rail fade">${r}</div></div>`;
}
function body(o){
 const th=o.th.map((t,i)=>`<div class="th rise" style="--i:${i+2}"><div class="thb">${i+1}</div><div class="tht">${tagize(t)}</div></div>`).join("");
 const stat=o.stat?`<div class="stat rise" style="--i:${o.th.length+2}"><div class="n">${o.stat.n}</div><div class="t">${o.stat.t}</div></div>`:'';
 return `<div class="content"><div class="ctitle rise">${o.title}</div>${o.sub?`<div class="csub rise" style="--i:1">${o.sub}</div>`:''}
   <div class="theses">${th}${stat}</div><div class="foot">vonhelga · Tool-Time</div></div>`;
}
function slide(o,mrail){return panel(o,mrail)+body(o);}

const deck=document.getElementById("deck");
S.forEach(h=>{const d=document.createElement("div");d.className="slide";d.innerHTML=h;deck.appendChild(d);});
const slides=[...deck.querySelectorAll(".slide")];
const dwrap=document.getElementById("dots");
slides.forEach((_,i)=>{const b=document.createElement("div");b.className="dot";b.onclick=()=>go(i);dwrap.appendChild(b);});
const dots=[...dwrap.children],bar=document.getElementById("bar");
let cur=-1;
function go(n){n=Math.max(0,Math.min(slides.length-1,n));if(n===cur)return;cur=n;
 slides.forEach((s,i)=>s.classList.toggle("on",i===n));dots.forEach((d,i)=>d.classList.toggle("on",i===n));
 bar.style.width=((n+1)/slides.length*100)+"%";}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(cur+1);}if(e.key==="ArrowLeft")go(cur-1);});
document.getElementById("stage").addEventListener("click",e=>{const r=deck.getBoundingClientRect();(e.clientX-r.left>r.width*0.5)?go(cur+1):go(cur-1);});
go(0);
