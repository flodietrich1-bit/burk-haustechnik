<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BURK Materialtracker - Prototyp</title>
<style>
:root{
  --ink:#1C2A3B; --ink2:#26384D; --amber:#3B82C4; --amber-d:#2C6AA6;
  --bg:#EEF1F4; --card:#FFFFFF; --line:#E2E7EC; --muted:#71808F;
  --green:#2FA36B; --green-bg:#E7F5EE; --red:#E0533D; --red-bg:#FBECE8;
  --ink-soft:#41505F; --lite:#EAF2FB;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.45;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
.wrap{max-width:1120px; margin:0 auto; padding:18px;}

/* top bar */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .logo{display:flex; flex-direction:column; line-height:.82; padding-right:2px;}
.brand .logo b{font-style:italic; font-weight:800; font-size:25px; color:var(--amber); letter-spacing:-.01em; transform:skewX(-7deg);}
.brand .logo small{font-size:8.5px; letter-spacing:.15em; color:#8A9096; font-weight:600; margin-top:2px;}
.brand .app{font-weight:600; color:var(--ink); font-size:16px;}
.brand .app span{color:var(--muted); font-weight:500;}
.roletoggle{display:flex; background:#DCE2E8; border-radius:10px; padding:3px;}
.roletoggle button{padding:8px 14px; border-radius:8px; font-weight:600; font-size:13.5px; color:var(--ink-soft);}
.roletoggle button.on{background:var(--ink); color:#fff;}

/* device frame */
.device{width:430px; max-width:100%; margin:0 auto; background:var(--card); border-radius:22px; box-shadow:0 12px 40px rgba(20,30,45,.14); overflow:hidden; border:1px solid var(--line);}
.d-head{background:var(--ink); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between;}
.d-head .t{font-weight:700; font-size:16px;}
.d-head .sub{font-size:12px; color:#AEB9C6;}
.d-head .kw{background:var(--amber); color:#fff; font-weight:700; font-size:12px; padding:3px 9px; border-radius:20px;}
.d-body{padding:16px; min-height:560px;}
.backbtn{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-weight:600; font-size:13.5px; margin-bottom:10px;}
.langbar{display:flex; align-items:center; gap:6px; padding:8px 16px; background:#F6F8FA; border-bottom:1px solid var(--line);}
.langbar .lg{font-size:14px; margin-right:2px;}
.langbar .lgp{font-size:12px; font-weight:700; color:var(--muted); padding:4px 10px; border-radius:8px;}
.langbar .lgp.on{background:var(--amber); color:#fff;}

/* rooms */
.proj{background:var(--ink2); color:#fff; border-radius:14px; padding:14px 16px; margin-bottom:14px;}
.proj .p1{font-weight:700; font-size:16px;}
.proj .p2{color:#AEB9C6; font-size:12.5px; margin-top:2px;}
.sect{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:6px 2px 10px;}
.room{display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:13px 14px; margin-bottom:10px; width:100%; text-align:left; transition:.12s;}
.room:active{transform:scale(.99);}
.room .ring{flex:0 0 46px;}
.room .r-name{font-weight:700; font-size:15px;}
.room .r-sub{font-size:12.5px; color:var(--muted); margin-top:1px;}
.room .r-pct{margin-left:auto; font-weight:800; font-size:15px;}
.chev{color:#C4CDD6; font-size:20px; margin-left:6px;}

/* book screen */
.modes{display:flex; gap:8px; margin-bottom:14px;}
.mode{flex:1; border:1.5px solid var(--line); border-radius:12px; padding:11px; text-align:center; font-weight:700; font-size:13.5px; color:var(--ink-soft); background:#fff;}
.mode.on{border-color:var(--amber); background:var(--lite); color:var(--ink);}
.mode small{display:block; font-weight:500; font-size:11px; color:var(--muted); margin-top:2px;}
.voicebox{background:var(--lite); border:1.5px dashed var(--amber-d); border-radius:12px; padding:14px; text-align:center; margin-bottom:14px;}
.voicebox .mic{width:52px; height:52px; border-radius:50%; background:var(--amber); display:inline-flex; align-items:center; justify-content:center; margin-bottom:8px;}
.voicebox .hint{font-size:12.5px; color:var(--ink-soft);}
.voicebox .said{font-size:13px; color:var(--muted); font-style:italic; margin-top:6px; min-height:18px;}

.dropwrap{margin-bottom:14px;}
.dropwrap label{font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;}
.dropwrap select{width:100%; padding:12px 12px; border:1.5px solid var(--line); border-radius:12px; font-size:15px; background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2371808F' stroke-width='2.5' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 12px center; -webkit-appearance:none; appearance:none; color:var(--ink); font-weight:600;}

.brow{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; background:#fff;}
.brow .ic{flex:0 0 44px; height:44px; border-radius:10px; background:#F1F4F7; display:flex; align-items:center; justify-content:center;}
.brow .info{flex:1; min-width:0;}
.brow .bn{font-weight:700; font-size:14px; line-height:1.2;}
.fn{color:#9AA6B2; font-style:italic; font-weight:500; font-size:.9em; margin-left:5px;}
.brow .bs{font-size:11.5px; color:var(--muted); margin-top:2px;}
.pool{font-size:11.5px; color:var(--ink-soft); margin-top:5px; display:flex; gap:8px; flex-wrap:wrap;}
.pool b{color:var(--ink);}
.pool .rest.neg{color:var(--red); font-weight:700;}
.bar{height:6px; border-radius:4px; background:#EDF1F4; overflow:hidden; margin-top:6px;}
.bar > i{display:block; height:100%; background:var(--green);}
.bar > i.over{background:var(--red);}
.stepper{flex:0 0 auto; display:flex; align-items:center; gap:0; border:1.5px solid var(--line); border-radius:11px; overflow:hidden;}
.stepper button{width:38px; height:40px; font-size:22px; font-weight:700; color:var(--ink); background:#F6F8FA;}
.stepper button:active{background:#ECEFF2;}
.stepper .val{min-width:48px; text-align:center; font-weight:800; font-size:16px;}
.stepper .unit{font-size:10px; color:var(--muted); font-weight:600; display:block; margin-top:-4px;}

.addwrap{margin:6px 0 16px;}
.primary{display:block; width:100%; background:var(--amber); color:#fff; font-weight:800; font-size:16px; padding:15px; border-radius:14px; text-align:center;}
.primary.dark{background:var(--ink); color:#fff;}
.ghost{display:block; width:100%; text-align:center; color:var(--muted); font-weight:700; padding:12px; font-size:14px;}
.footcta{position:sticky; bottom:0; padding-top:8px;}
.rec360{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; border:1.5px solid var(--ink); background:#fff; color:var(--ink); font-weight:700; font-size:14px; padding:12px; border-radius:12px; margin-bottom:14px;}
.rec360 .dot{width:9px; height:9px; border-radius:50%; background:var(--red);}
.slate{background:var(--ink); color:#fff; border-radius:16px; padding:16px; text-align:center;}
.slate-h{font-weight:800; font-size:15px; margin-bottom:12px;}
.slate-qr{background:#fff; border-radius:10px; padding:10px; width:196px; height:196px; margin:0 auto 12px;}
.slate-hint{font-size:12.5px; color:#D9DEE4; margin-bottom:14px;}
.slate-hint b{color:#fff;}
.slate-fields{background:var(--ink2); border-radius:10px; padding:4px 12px; text-align:left;}
.slate-fields > div{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid #34465C; font-size:12.5px;}
.slate-fields > div:last-child{border-bottom:none;}
.slate-fields span{color:#9FB0C0;}
.slate-fields b{color:#fff; text-align:right; word-break:break-all;}
.slate-off{font-size:11px; color:#9FB0C0; margin-top:11px;}
.act{display:block; width:100%; text-align:center; border:1.5px solid var(--line); background:#fff; color:var(--ink); font-weight:700; font-size:14px; padding:12px; border-radius:12px; margin-bottom:14px;}
.ti{width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:11px; font-size:15px; color:var(--ink); outline:none; background:#fff;}
.ptile.filled img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.reo{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #EEF1F4;}
.reo:last-child{border-bottom:none;}
.bkhead{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px;}
.addbtn{flex:0 0 auto; border:1.5px solid var(--line); border-radius:20px; font-size:12px; font-weight:700; color:var(--blue-d); padding:7px 12px; white-space:nowrap; background:#fff;}
.sigpad{width:100%; height:120px; border:1.5px dashed var(--line); border-radius:11px; background:#fff; touch-action:none; display:block;}

/* photos */
.pgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 16px;}
.ptile{aspect-ratio:4/3; border-radius:12px; background:#F1F4F7; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12.5px; font-weight:600; overflow:hidden; position:relative;}
.ptile.filled{border-style:solid; border-color:var(--line); background:linear-gradient(135deg,#2B3543,#41505F); color:#fff;}
.ptile.filled span{position:absolute; bottom:6px; left:8px; font-size:11px; opacity:.9;}
.addtile{border-color:var(--amber-d); color:var(--amber-d); background:var(--lite);}

/* done */
.done{text-align:center; padding:26px 8px;}
.done .check{width:70px; height:70px; border-radius:50%; background:var(--green-bg); color:var(--green); display:inline-flex; align-items:center; justify-content:center; font-size:38px; margin-bottom:14px;}
.done h2{font-size:20px;}
.done p{color:var(--muted); margin-top:6px; font-size:14px;}
.summary{background:#F6F8FA; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:16px 0; text-align:left;}
.summary .sr{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; border-bottom:1px solid var(--line);}
.summary .sr:last-child{border-bottom:none;}

/* PL dashboard */
.pl-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
.pl-head h1{font-size:22px;}
.pl-head .sub{color:var(--muted); font-size:13.5px;}
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px;}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px;}
.kpi .k-l{font-size:12px; color:var(--muted); font-weight:600;}
.kpi .k-v{font-size:24px; font-weight:800; margin-top:4px;}
.kpi .k-s{font-size:11.5px; color:var(--muted); margin-top:2px;}
.kpi.accent{background:var(--ink); color:#fff;}
.kpi.accent .k-l,.kpi.accent .k-s{color:#AEB9C6;}
.kpi .k-v .u{font-size:14px; font-weight:600; color:var(--muted);}
.grid2{display:grid; grid-template-columns:1.35fr 1fr; gap:12px; margin-bottom:14px;}
.panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px;}
.panel h3{font-size:14px; margin-bottom:12px;}
.panel h3 small{color:var(--muted); font-weight:500;}
.roomsbars .rb{margin-bottom:11px;}
.roomsbars .rb .rt{display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:4px;}
.roomsbars .rb .rt span{color:var(--muted); font-weight:600;}
.tbar{height:9px; border-radius:5px; background:#EDF1F4; overflow:hidden;}
.tbar>i{display:block; height:100%; background:var(--amber);}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:right; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; padding:6px 8px; border-bottom:1px solid var(--line);}
th.l,td.l{text-align:left;}
td{padding:8px 8px; border-bottom:1px solid #EEF1F4; text-align:right; white-space:nowrap;}
td .mm{font-weight:700;}
td .ms{font-size:11px; color:var(--muted);}
.pctcell{display:flex; align-items:center; gap:8px; justify-content:flex-end;}
.pctcell .mini{width:54px; height:7px; border-radius:4px; background:#EDF1F4; overflow:hidden;}
.pctcell .mini>i{display:block; height:100%; background:var(--green);}
.tag{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;}
.tag.g{background:var(--green-bg); color:var(--green);} .tag.r{background:var(--red-bg); color:var(--red);} .tag.a{background:var(--lite); color:var(--amber-d);}
.tag.n{background:#EDF1F4; color:#5A6B7A; margin-right:5px;}
.split3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px;}
.split3 .s{background:#F6F8FA; border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
.split3 .s .sl{font-size:11.5px; color:var(--muted);}
.split3 .s .sv{font-size:18px; font-weight:800; margin-top:2px;}
.timeline{display:flex; gap:8px; overflow:auto; padding-bottom:4px;}
.timeline .tt{flex:0 0 92px;}
.timeline .th{aspect-ratio:4/3; border-radius:9px; background:linear-gradient(135deg,#2B3543,#41505F);}
.timeline .tl{font-size:11px; color:var(--muted); margin-top:4px; text-align:center; font-weight:600;}
.note{font-size:11.5px; color:var(--muted); margin-top:10px;}
@media(max-width:720px){ .kpis{grid-template-columns:1fr 1fr;} .grid2{grid-template-columns:1fr;} }
</style>
</head>

app.initSig = function(){
  const cv=document.getElementById('sigpad'); if(!cv) return;
  const ctx=cv.getContext('2d'); ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1C2A3B';
  this.sigHasInk=false; let drawing=false, last=null;
  const pos=e=>{const r=cv.getBoundingClientRect(); const t=(e.touches&&e.touches[0])||e; return [(t.clientX-r.left)*(cv.width/r.width),(t.clientY-r.top)*(cv.height/r.height)];};
  cv.addEventListener('pointerdown',e=>{drawing=true; last=pos(e); e.preventDefault();});
  cv.addEventListener('pointermove',e=>{ if(!drawing)return; const q=pos(e); ctx.beginPath(); ctx.moveTo(last[0],last[1]); ctx.lineTo(q[0],q[1]); ctx.stroke(); last=q; app.sigHasInk=true; e.preventDefault();});
  window.addEventListener('pointerup',()=>{drawing=false;});
};
app.clearSig = function(){ const cv=document.getElementById('sigpad'); if(cv){ cv.getContext('2d').clearRect(0,0,cv.width,cv.height); } this.sigHasInk=false; };

/* ---- icons ---- */
function icon(kind,color){
  const c = color||'#41505F';
  const S = `stroke="${c}" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  const paths = {
    pipe:`<path ${S} d="M3 9h14a4 4 0 0 1 4 4v2M3 9v6h14"/><path ${S} d="M3 8.2v7.6M17 13v3.5"/>`,
    bend:`<path ${S} d="M6 21v-6a9 9 0 0 1 9-9h3"/><path ${S} d="M4.5 21h3M15 4.5v3"/>`,
    tee:`<path ${S} d="M3 10h18M3 14h18M12 14v6"/><path ${S} d="M3 9.5v5M21 9.5v5M10.5 20h3"/>`,
    red:`<path ${S} d="M3 8h7l4 3v2l-4 3H3"/><path ${S} d="M3 7.5v9"/>`,
    clamp:`<circle ${S} cx="12" cy="12" r="6"/><path ${S} d="M12 6V3M12 21v-3"/>`,
    valve:`<path ${S} d="M12 12l-6-4v8zM12 12l6-4v8z"/><path ${S} d="M12 12V5M9 5h6"/>`,
  };
  return `<svg width="24" height="24" viewBox="0 0 24 24">${paths[kind]||paths.pipe}</svg>`;
}
function ring(pct){
  const r=18, c=2*Math.PI*r, off=c*(1-pct/100);
  const col = pct>=75?'#2FA36B':pct>=45?'#3B82C4':'#E0533D';
  return `<svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" fill="none" stroke="#EDF1F4" stroke-width="5"/><circle cx="23" cy="23" r="18" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 23 23)"/><text x="23" y="27" text-anchor="middle" font-size="12" font-weight="800" fill="#1E2632">${pct}</text></svg>`;
}

function pseudoQR(seed){
  const N=25, m=8, size=N*m;
  const h=(x)=>{let s=2166136261>>>0;for(let i=0;i<x.length;i++){s^=x.charCodeAt(i);s=Math.imul(s,16777619);}return s>>>0;};
  const finder=(r,c,R,C)=>{const rr=r-R,cc=c-C;if(rr<0||rr>6||cc<0||cc>6)return null;const b=(rr===0||rr===6||cc===0||cc===6),inn=(rr>=2&&rr<=4&&cc>=2&&cc<=4);return b||inn;};
  let cells='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    let on=finder(r,c,0,0); if(on===null)on=finder(r,c,0,N-7); if(on===null)on=finder(r,c,N-7,0);
    if(on===null) on=((h(seed+r+'_'+c)&1)===1);
    if(on) cells+=`<rect x="${c*m}" y="${r*m}" width="${m}" height="${m}"/>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="#fff"/><g fill="#0c0c0d">${cells}</g></svg>`;
}

  const over = rest<0;
  return `
   <div class="brow">
     <div class="ic">${icon(m.ic, over?'#E0533D':'#41505F')}</div>
     <div class="info">
       <div class="bn">${m.n}${this.matFx(m)?` <i class="fn">${this.matFx(m)}</i>`:''}</div>

   <div class="sect" style="margin-top:18px;">${this.t('nachtragOpen')}</div>
   <div style="border:1px solid var(--line);border-radius:12px;padding:2px 12px;">${list}</div>`;
};
app.viewPhotos = function(){
  let tiles=(this.photoList||[]).map((src,i)=> src
    ? `<div class="ptile filled"><img src="${src}" alt=""><span>KW27 · Foto ${i+1}</span></div>`
    : `<div class="ptile filled"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.2"/><path d="M8 6l1.5-2h5L16 6"/></svg><span>KW27 · Foto ${i+1}</span></div>`).join('');
  tiles+=`<div class="ptile addtile" onclick="app.addPhoto()">${this.t('addPhoto')}</div>`;
  return `
   <button class="backbtn" onclick="app.screen='book';app.render()">‹ ${this.t('backShort')}</button>
   <div style="font-weight:800;font-size:17px;">${this.t('photoTitle')} · ${this.room.n}</div>
   <div style="color:var(--muted);font-size:13px;margin:2px 0 14px;">${this.t('photoSub')}</div>
   <div class="pgrid">${tiles}</div>
   <div class="footcta"><button class="primary" onclick="app.commit()">${this.t('finish')}</button>
   <button class="ghost" onclick="app.screen='book';app.render()">${this.t('backToBook')}</button></div>`;
};

app.commit = function(){
  Object.entries(this.session).forEach(([id,d])=>{
    const m=this.materials.find(x=>x.id===id); if(m) m.verb = Math.min(m.gel, m.verb + d);
  });
  this.lastSummary = Object.entries(this.session).filter(([,d])=>d>0).map(([id,d])=>{
    const m=this.materials.find(x=>x.id===id); return {n:m.n, d, u:m.u};
  });
  this.screen='done'; this.render();
};

app.viewDone = function(){
  const rows = (this.lastSummary||[]).map(s=>`<div class="sr"><span>${s.n}</span><b>+${num(s.d)} ${s.u}</b></div>`).join('') || `<div class="sr"><span>Keine Mengen erfasst</span><b>–</b></div>`;
  return `<div class="done">
     <div class="check">✓</div>
     <h2>${this.t('doneTitle')}</h2>
     <p>${this.room.n} · ${this.t('doneSub',{n:(this.photoList||[]).length})}</p>
   </div>
   <div class="summary">${rows}</div>
   <button class="primary" onclick="app.screen='rooms';app.render()">${this.t('backToRooms')}</button>
   <button class="ghost" onclick="app.setRole('pl')">${this.t('viewAsPL')}</button>`;
};

/* ---- PL dashboard ---- */
app.renderPL = function(){
  const M = this.materials;
  const gelW = M.reduce((a,m)=>a+m.gel*m.p,0);
  const verbW = M.reduce((a,m)=>a+m.verb*m.p,0);
  const prog = Math.round(verbW/gelW*100);
  const cut = M.filter(m=>m.cut);
  const cutGel = cut.reduce((a,m)=>a+m.gel,0), cutVerb=cut.reduce((a,m)=>a+m.verb,0);
  const verschnitt = Math.round((cutGel-cutVerb)/cutGel*100);
  const offeneRaeume = this.rooms.filter(r=>r.pct<100).length;

  const rowsHtml = M.map(m=>{
    const rest=m.gel-m.verb, pct=Math.round(m.verb/m.gel*100);
    const tag = pct>=90?'<span class="tag g">fast fertig</span>':pct>=50?'<span class="tag a">läuft</span>':'<span class="tag r">früh</span>';
    return `<tr>
      <td class="l"><div class="mm">${m.n}</div><div class="ms">${m.s}</div></td>
      <td>${num(m.gel)} ${m.u}</td>
      <td><b>${num(m.verb)}</b></td>
      <td>${num(rest)}</td>
      <td><div class="pctcell"><div class="mini"><i style="width:${pct}%"></i></div>${pct}%</div></td>
      <td>${money(m.verb*m.p)} €</td>
      <td class="l">${tag}</td>
    </tr>`;
  }).join('');

  const roomsBars = this.rooms.map(r=>`<div class="rb"><div class="rt"><span style="color:var(--ink)">${r.n}</span><span>${r.pct}%</span></div><div class="tbar"><i style="width:${r.pct}%"></i></div></div>`).join('');

  const stTag = s => s==='geliefert'?'<span class="tag g">geliefert</span>':s==='bestellt'?'<span class="tag a">bestellt</span>':'<span class="tag r">angefragt</span>';
  const tType = t => t==='stunden'?'<span class="tag n">Stundenlohn</span>':'<span class="tag n">Material</span>';
  const reorderHtml = (this.reorders||[]).map(r=>`<div class="reo"><div><div class="mm">${r.mat}</div><div class="ms">${r.qty} · ${r.room} · ${r.besteller||'—'}${r.ts?' · '+r.ts:''}${r.signed?' · ✍︎ signiert':''}</div></div><div style="white-space:nowrap">${tType(r.type)}${stTag(r.status)}</div></div>`).join('') || '<div class="ms" style="padding:8px 0;">Keine Nachträge.</div>';

  // simple progress-over-time chart (KW23..27), last point = live prog
  const hist=[41,55,64,72,prog]; const kws=['KW23','KW24','KW25','KW26','KW27'];
  const cw=440,ch=150,pad=24;
  const pts=hist.map((v,i)=>[pad+(cw-2*pad)*i/(hist.length-1), ch-pad-(ch-2*pad)*v/100]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${pts[0][0]} ${ch-pad} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${pts[pts.length-1][0]} ${ch-pad} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i==pts.length-1?4.5:3}" fill="${i==pts.length-1?'#3B82C4':'#1E2632'}"/>`).join('');
  const labels=kws.map((k,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${ch-6}" font-size="10" fill="#71808F" text-anchor="middle">${k}</text>`).join('');
  const chart=`<svg width="100%" viewBox="0 0 ${cw} ${ch}"><path d="${area}" fill="#3B82C422"/><path d="${line}" fill="none" stroke="#1E2632" stroke-width="2"/>${dots}${labels}<text x="${pts[4][0]-4}" y="${pts[4][1]-10}" font-size="11" font-weight="800" fill="#2C6AA6" text-anchor="end">${prog}%</text></svg>`;

  document.getElementById('pl').innerHTML = `
   <div class="pl-head"><div><h1>Projektleiter-Dashboard</h1><div class="sub">Hallenbad Weingarten · AG 00030004 · Stand KW 27</div></div></div>
   <div class="kpis">
     <div class="kpi accent"><div class="k-l">Verbauter Wert</div><div class="k-v">${money(verbW)} <span class="u">€</span></div><div class="k-s">von ${money(gelW)} € geliefert</div></div>
     <div class="kpi"><div class="k-l">Fortschritt gesamt</div><div class="k-v">${prog}%</div><div class="k-s">wertgewichtet, verbaut/geliefert</div></div>
     <div class="kpi"><div class="k-l">Rest Schnittware</div><div class="k-v">${verschnitt}%</div><div class="k-s">Verschnitt/Rückware offen</div></div>
     <div class="kpi"><div class="k-l">Offene Räume</div><div class="k-v">${offeneRaeume}<span class="u"> / ${this.rooms.length}</span></div><div class="k-s">noch nicht fertig</div></div>
   </div>

   <div class="grid2">
     <div class="panel"><h3>Fortschritt über Zeit <small>· Ausbuch-% je Woche (Liquiditätskurve)</small></h3>${chart}
       <div class="note">Je häufiger ausgebucht wird, desto aktueller der verbaute Wert - Basis für frühere Abschlagsrechnungen.</div>
     </div>
     <div class="panel"><h3>Räume</h3><div class="roomsbars">${roomsBars}</div></div>
   </div>

   <div class="panel" style="margin-bottom:14px;">
     <h3>Material · Plan-Ist je Position</h3>
     <div style="overflow:auto;">
     <table>
       <thead><tr><th class="l">Material</th><th>geliefert</th><th>verbaut</th><th>Rest</th><th>Fortschritt</th><th>Wert verbaut</th><th class="l">Status</th></tr></thead>
       <tbody>${rowsHtml}</tbody>
     </table></div>
     <div class="split3">
       <div class="s"><div class="sl">Echter Verschnitt (Schnittware)</div><div class="sv">${verschnitt}%</div></div>
       <div class="s"><div class="sl">Rückware (Stückware, wiederverwendbar)</div><div class="sv">~ €${money(M.filter(m=>!m.cut).reduce((a,m)=>a+(m.gel-m.verb)*m.p,0))}</div></div>
       <div class="s"><div class="sl">Schwund (Differenz ungeklärt)</div><div class="sv">offen</div></div>
     </div>
   </div>

   <div class="panel" style="margin-bottom:14px;">
     <h3>Nachträge <small>· Material &amp; Stundenlohn, mit Unterschrift</small></h3>
     <div>${reorderHtml}</div>
     <button class="act" style="margin:12px 0 0" onclick="app.reorders.unshift({type:'material',mat:'Neue Position (Demo)',qty:'-',room:'—',besteller:'—',ts:'jetzt',signed:false,status:'angefragt'});app.renderPL();">＋ Nachtrag / Lieferschein erfassen</button>
   </div>

   <div class="panel">
     <h3>Foto-Zeitleiste <small>· Rundum-Belege je Version</small></h3>
     <div class="timeline">
       ${['KW23','KW24','KW25','KW26','KW27'].map(k=>`<div class="tt"><div class="th"></div><div class="tl">${k}</div></div>`).join('')}
     </div>
     <div class="note">Klick auf eine Woche zeigt im Vollprodukt die Rundum-Fotos - für Nachvollziehbarkeit und Nachzählen ohne Baustellenbesuch.</div>
   </div>`;
};
