<!DOCTYPE html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statusbericht & Übergabe · Digitale Mengenerfassung · Firmengruppe Burk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A2540;--navy2:#0E3C63;--blue:#0082C9;--blueL:#3FA9E8;--sky:#8FD0F5;
 --bg:#EEF3F8;--ink:#152534;--slate:#5C6B7A;--line:#E1E9F1;--card:#FFFFFF;
 --amber:#E08A2B;--amberbg:#FBEEDD;--teal:#12897E;--tealbg:#E1F3F1;--green:#1F6B41;--greenbg:#EAF6EE;}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{font-family:Inter,system-ui,Arial,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 50% -10%,#12314f,#081a2c 70%);overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.deck{position:relative;width:min(95vw,1300px);height:min(95vh,731px);border-radius:20px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.55)}
#bar{position:absolute;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--blueL));z-index:40;transition:width .5s;border-radius:0 3px 3px 0}
.slide{position:absolute;inset:0;background:var(--bg);display:none;padding:52px 60px}
.slide.on{display:block}
.slide.on .r{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*80ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.kick{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700}
.slide.dark .kick{color:var(--sky)}
h1{font-family:Sora;font-size:32px;font-weight:800;letter-spacing:-.4px;margin-top:9px;line-height:1.12}
.slide.dark{background:linear-gradient(160deg,var(--navy),var(--navy2))}.slide.dark h1{color:#fff}
.corner{position:absolute;top:26px;right:30px;width:52px;height:52px;border-radius:10px;overflow:hidden;opacity:.9}
.corner img{width:100%;display:block}
.foot{position:absolute;left:60px;bottom:22px;font-size:12px;color:#9aa9b7}
.pg{position:absolute;right:30px;bottom:22px;font-size:12px;color:#9aa9b7}
.slide.dark .foot,.slide.dark .pg{color:#7FB4D8}
.lead{color:var(--slate);font-size:15px;margin-top:10px;max-width:900px;line-height:1.5}

/* hero */
.hlogo{width:150px;height:150px;border-radius:16px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.35)}
.hlogo img{width:100%;display:block}
.big{font-family:Sora;font-size:44px;font-weight:800;color:#fff;line-height:1.08;margin-top:30px;letter-spacing:-.5px}
.big2{font-size:22px;color:#BFE0F4;margin-top:14px;font-weight:600}
.hmeta{color:#9FC7E4;font-size:14px;margin-top:24px;line-height:1.6}

/* lists */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px 30px;margin-top:26px}
.it{display:flex;gap:14px;align-items:flex-start}
.ib{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-family:Sora;margin-top:2px;background:#fff;border:1px solid var(--line);color:var(--blue);box-shadow:0 3px 8px rgba(20,50,80,.06)}
.ib.g{background:var(--green);border:none;color:#fff}.ib.a{background:var(--amber);border:none;color:#fff}
.itx{font-size:15px;line-height:1.45;color:#263646}.itx b{color:var(--ink)}
.itx small{display:block;color:var(--slate);font-size:13px;margin-top:2px}

/* decisions */
.dec{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.drow{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:0 6px 16px rgba(20,50,80,.05)}
.dn{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-family:Sora;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.dq{font-family:Sora;font-weight:700;font-size:15.5px;color:var(--ink)}
.da{font-size:13.5px;color:var(--slate);margin-top:3px;line-height:1.4}
.rec{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--blue);background:var(--bg);border:1px solid #CFE2F5;border-radius:20px;padding:5px 11px;white-space:nowrap}

/* callouts */
.note{border-radius:12px;padding:15px 18px;font-size:14px;line-height:1.5;margin-top:14px}
.note.amber{background:var(--amberbg);color:#7a4a12;border:1px solid #EBCB9E}
.note.amber b{color:#5f3a0e}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 6px 16px rgba(20,50,80,.05)}
.panel h3{font-family:Sora;font-size:16px;font-weight:800;margin-bottom:9px}
.panel p{font-size:13.8px;color:#33475b;line-height:1.5}.panel p b{color:var(--ink)}
.stat{display:flex;gap:26px;margin-top:8px;flex-wrap:wrap}
.stat .s{background:rgba(255,255,255,.06);border:1px solid rgba(143,208,245,.2);border-radius:12px;padding:14px 18px}
.stat .n{font-family:Sora;font-size:26px;font-weight:800;color:#fff}
.stat .l{font-size:12px;color:#9FC7E4;margin-top:3px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;margin-top:20px}
.role{font-size:14px;color:#cfe3f4}.role b{color:#fff}
#dots{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:50}
.dot{width:8px;height:8px;border-radius:50%;background:#3a5871;cursor:pointer;transition:.25s}.dot.on{background:var(--blueL);width:22px;border-radius:5px}
.hint{position:fixed;bottom:16px;right:18px;color:#5c778f;font-size:11.5px;z-index:50}
</style></head><body>

const deck=document.getElementById("deck");
deck.innerHTML='<div id="bar"></div>'+S.join('');
const slides=[...deck.querySelectorAll(".slide")];
const dw=document.getElementById("dots");
slides.forEach((_,i)=>{const b=document.createElement("div");b.className="dot";b.onclick=()=>go(i);dw.appendChild(b);});
const dots=[...dw.children],bar=document.getElementById("bar");
let cur=-1;
function go(n){n=Math.max(0,Math.min(slides.length-1,n));if(n===cur)return;cur=n;
 slides.forEach((s,i)=>s.classList.toggle("on",i===n));dots.forEach((d,i)=>d.classList.toggle("on",i===n));
 bar.style.width=((n+1)/slides.length*100)+"%";}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(cur+1);}if(e.key==="ArrowLeft")go(cur-1);});
document.getElementById("stage").addEventListener("click",e=>{const r=deck.getBoundingClientRect();(e.clientX-r.left>r.width*0.5)?go(cur+1):go(cur-1);});
go(0);
</script></body></html>
